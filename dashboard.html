<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Dashboard Mercati Pro</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--t2:#6e6e73;--t3:#86868b;--b:#e5e5e5;--up:#2d8a3e;--dn:#c41e3a;--ac:#0071e3;--sh:rgba(0,0,0,.08);--al:#ff9500}
[data-theme="dark"]{--bg:#0d0d0d;--card:#1c1c1e;--text:#f5f5f7;--t2:#8e8e93;--t3:#636366;--b:#2c2c2e;--up:#32d74b;--dn:#ff453a;--ac:#0a84ff;--sh:rgba(0,0,0,.3);--al:#ff9f0a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1c1c1e;--text:#f5f5f7;--t2:#8e8e93;--t3:#636366;--b:#2c2c2e;--up:#32d74b;--dn:#ff453a;--ac:#0a84ff;--sh:rgba(0,0,0,.3);--al:#ff9f0a}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px 24px;transition:background .3s,color .3s}
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.tb h1{font-size:22px;font-weight:600}
.tb p{font-size:12px;color:var(--t2);margin-top:3px}
.tr{display:flex;align-items:center;gap:14px}
.ut{font-size:11px;color:var(--t3)}
.tt{background:var(--card);border:1px solid var(--b);color:var(--t2);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500}
.tt:hover{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);background:var(--card);border:1px solid var(--b)}
.tab:hover{border-color:var(--t3);color:var(--text)}
.tab.a{background:var(--text);color:var(--bg);border-color:var(--text)}
.sec{display:none}
.sec.a{display:block}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media(min-width:1200px){.g2{grid-template-columns:repeat(2,1fr)}}
.c{background:var(--card);border-radius:12px;padding:16px 18px;border:1px solid var(--b);transition:box-shadow .2s,transform .2s;position:relative;overflow:hidden;animation:fiu .5s ease both}
.c:hover{box-shadow:0 4px 20px var(--sh);transform:translateY(-2px)}
.c.al{border-color:var(--al);box-shadow:0 0 0 2px var(--al);animation:fiu .5s ease both,pulse 2s infinite}
@keyframes fiu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--al)}50%{box-shadow:0 0 0 5px rgba(255,149,0,.3)}}
.ab{position:absolute;top:8px;right:8px;background:var(--al);color:#000;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.n{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.p{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.r{display:flex;align-items:baseline;gap:12px;margin-top:5px}
.ch{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.cw{width:100%;height:50px;margin-top:10px;position:relative}
.cw svg{width:100%;height:100%;display:block}
.bm{display:inline-block;font-size:9px;background:var(--ac);color:#fff;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;font-weight:600}
.ft{margin-top:28px;font-size:10px;color:var(--t3);text-align:center}
.h2{font-size:18px;font-weight:600;margin:32px 0 16px}

/* Mini card storici cliccabili */
.lc-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--b);margin-bottom:16px;cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s}
.lc-card:hover{border-color:var(--ac);box-shadow:0 4px 20px var(--sh);transform:translateY(-2px)}
.lc-card h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.lc-card .open-hint{font-size:11px;color:var(--ac);font-weight:500;opacity:0;transition:opacity .2s}
.lc-card:hover .open-hint{opacity:1}
.lc-card svg{width:100%;height:200px;display:block}
.lc-card .info{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--t2)}
.lc-card .info span{font-weight:600;color:var(--text)}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}

/* Modal */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:28px;width:100%;max-width:1100px;max-height:92vh;overflow:auto;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.35);animation:fiu .35s ease both}
.modal-close{position:absolute;top:14px;right:18px;font-size:26px;cursor:pointer;color:var(--t2);line-height:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s,color .2s}
.modal-close:hover{background:var(--b);color:var(--text)}
.modal h2{font-size:20px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--t2);margin-bottom:18px}
.modal-chart-wrap{position:relative;width:100%;height:420px;margin-bottom:20px}
.modal-chart-wrap svg{width:100%;height:100%;display:block}
.modal-tooltip{position:absolute;background:var(--card);border:1px solid var(--b);border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 16px var(--sh);z-index:10;white-space:nowrap}
.modal-tooltip .tt-date{color:var(--t2);font-size:11px;margin-bottom:2px}
.modal-tooltip .tt-val{color:var(--text);font-weight:600;font-size:14px}
.modal-line{stroke:var(--ac);stroke-width:1;stroke-dasharray:4 4;opacity:0;pointer-events:none}
.modal-dot{fill:var(--ac);stroke:var(--card);stroke-width:3;opacity:0;pointer-events:none}
.modal-overlay{fill:transparent;cursor:crosshair}

/* Tabella dati */
.data-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.data-table th,.data-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--b)}
.data-table th{color:var(--t2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.data-table td{font-variant-numeric:tabular-nums}
.data-table tr:hover td{background:rgba(10,132,255,.06)}
.data-table .dt-var{font-weight:600}
</style>
</head>
<body>
<div class="tb"><div><h1>📈 Dashboard Mercati Pro</h1><p>Forex · Indici · Settori · Macro · Commodities · Crypto</p></div><div class="tr"><span class="ut" id="ut"></span><button class="tt" onclick="tog()">🌓 Tema</button></div></div>
<div class="tabs">
<button class="tab a" onclick="sw('fx')">Forex (8)</button>
<button class="tab" onclick="sw('ix')">Indici (6)</button>
<button class="tab" onclick="sw('sc')">Settori (5)</button>
<button class="tab" onclick="sw('mc')">Macro & Altro (9)</button>
</div>
<div id="s-fx" class="sec a"><div class="g" id="g-fx"></div></div>
<div id="s-ix" class="sec"><div class="g g2" id="g-ix"></div></div>
<div id="s-sc" class="sec"><div class="g" id="g-sc"></div></div>
<div id="s-mc" class="sec"><div class="g" id="g-mc"></div></div>

<h2 class="h2">📊 Andamenti Storici (12 Mesi)</h2>
<div class="lc-grid" id="lc"></div>

<!-- Modal unico -->
<div id="modal" class="modal" onclick="closeModalOutside(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-close" onclick="closeModal()">&times;</div>
    <h2 id="modal-title"></h2>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-chart-wrap" id="modal-chart-wrap">
      <svg id="modal-svg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="modalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--ac)" stop-opacity=".28"/>
            <stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect id="modal-grid" fill="none" stroke="var(--b)" stroke-width=".5" stroke-dasharray="4 4"/>
        <polyline id="modal-line-path" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon id="modal-area" fill="url(#modalGrad)"/>
        <line id="modal-guide" class="modal-line" x1="0" y1="0" x2="0" y2="420"/>
        <circle id="modal-point" class="modal-dot" r="5"/>
        <text id="modal-label-start" font-size="11" fill="var(--t2)"></text>
        <text id="modal-label-end" font-size="11" fill="var(--t2)"></text>
        <text id="modal-val-start" font-size="11" fill="var(--t2)" text-anchor="end"></text>
        <text id="modal-val-end" font-size="12" fill="var(--ac)" font-weight="600"></text>
        <rect id="modal-hit" class="modal-overlay" width="900" height="420"/>
      </svg>
      <div id="modal-tooltip" class="modal-tooltip">
        <div class="tt-date" id="tt-date"></div>
        <div class="tt-val" id="tt-val"></div>
      </div>
    </div>
    <table class="data-table" id="modal-table">
      <thead><tr><th>Mese</th><th>Valore</th><th>Variazione</th><th>Var %</th></tr></thead>
      <tbody id="modal-tbody"></tbody>
    </table>
  </div>
</div>

function candle(cd,mn,mx){const w=220,h=50,px=2,n=cd.length,r=mx-mn||1,bw=(w-px*2)/n*.7,sp=(w-px*2)/n*.3;let s="";cd.forEach((c,i)=>{const o=c[0],hi=c[1],lo=c[2],cl=c[3],x=px+i*(bw+sp)+sp/2,bo=h-((Math.max(o,cl)-mn)/r)*(h-4)-2,bc=h-((Math.min(o,cl)-mn)/r)*(h-4)-2,bh=Math.abs(bc-bo)||1,yt=h-((hi-mn)/r)*(h-4)-2,yb=h-((lo-mn)/r)*(h-4)-2,up=cl>=o,col=up?"var(--up)":"var(--dn)";s+='<line x1="'+x+'" y1="'+yt+'" x2="'+x+'" y2="'+yb+'" stroke="'+col+'" stroke-width="1"/>';s+='<rect x="'+(x-bw/2)+'" y="'+Math.min(bo,bc)+'" width="'+bw+'" height="'+bh+'" fill="'+col+'" rx="1"/>'});return'<div class="cw"><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+s+'</svg></div>'}

/* ===== GRAFICI STORICI MINI + MODAL ===== */
const lc=document.getElementById("lc");

function buildMini(name, d, idx) {
  const labels=d[0], prices=d[1], mn=d[2], mx=d[3], w=700, h=200, px=50, py=20, r=mx-mn||1, n=prices.length;
  let pts="", area="";
  prices.forEach((p,i)=>{const x=px+(i/(n-1))*(w-px*2), y=h-py-((p-mn)/r)*(h-py*2); pts+=(i?"L":"M")+x+","+y; area+=x+","+y+" "});
  area+=(w-px)+","+h+" "+px+","+h;
  const firstX=px, lastX=px+((n-1)/(n-1))*(w-px*2), firstY=h-py-((prices[0]-mn)/r)*(h-py*2), lastY=h-py-((prices[n-1]-mn)/r)*(h-py*2);
  const varTot=((prices[prices.length-1]-prices[0])/prices[0]*100).toFixed(2);
  const gradId="g"+name.replace(/[^a-z]/gi,"")+idx;
  return `
  <div class="lc-card" onclick="openModal('${name.replace(/'/g,"\'")}')">
    <h3>${name} <span class="open-hint">Clicca per dettagli →</span></h3>
    <svg viewBox="0 0 ${w} ${h}">
      <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--ac)" stop-opacity=".25"/><stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
      <rect x="${px}" y="${py}" width="${w-px*2}" height="${h-py*2}" fill="none" stroke="var(--b)" stroke-width=".5" stroke-dasharray="4 4"/>
      <polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="${area}" fill="url(#${gradId})"/>
      <circle cx="${lastX}" cy="${lastY}" r="4" fill="var(--ac)" stroke="var(--card)" stroke-width="2"/>
      <text x="${px}" y="${py-4}" font-size="10" fill="var(--t2)">${labels[0]}</text>
      <text x="${w-px-40}" y="${py-4}" font-size="10" fill="var(--t2)">${labels[labels.length-1]}</text>
      <text x="${px-5}" y="${firstY}" font-size="10" fill="var(--t2)" text-anchor="end">${prices[0]}</text>
      <text x="${lastX+8}" y="${lastY}" font-size="11" fill="var(--ac)" font-weight="600">${prices[prices.length-1]}</text>
    </svg>
    <div class="info"><span>Min: ${mn}</span><span>Max: ${mx}</span><span>Var: ${varTot}%</span></div>
  </div>`;
}

Object.entries(L).forEach(([name,d], idx)=>{
  lc.innerHTML += buildMini(name, d, idx);
});

/* ===== MODAL INTERATTIVO ===== */
let currentModalData = null;

function openModal(name) {
  const data = L[name];
  if (!data) return;
  currentModalData = { name, labels: data[0], prices: data[1], mn: data[2], mx: data[3] };
  document.getElementById('modal-title').textContent = name;
  const varTot = ((data[1][data[1].length-1] - data[1][0]) / data[1][0] * 100).toFixed(2);
  const segno = varTot >= 0 ? '+' : '';
  const col = varTot >= 0 ? 'var(--up)' : 'var(--dn)';
  document.getElementById('modal-sub').innerHTML = `Andamento 12 mesi · <span style="color:${col};font-weight:600">${segno}${varTot}%</span> da inizio periodo`;
  renderModalChart();
  renderModalTable();
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
  currentModalData = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderModalChart() {
  const { labels, prices, mn, mx } = currentModalData;
  const w = 900, h = 420, px = 70, py = 40, n = prices.length;
  const r = mx - mn || 1;

  // Calcola punti
  let pts = "", area = "";
  const xs = [], ys = [];
  prices.forEach((p, i) => {
    const x = px + (i / (n - 1)) * (w - px * 2);
    const y = h - py - ((p - mn) / r) * (h - py * 2);
    xs.push(x); ys.push(y);
    pts += (i ? "L" : "M") + x + "," + y;
    area += x + "," + y + " ";
  });
  area += (w - px) + "," + h + " " + px + "," + h;

  // Griglia
  const grid = document.getElementById('modal-grid');
  grid.setAttribute('x', px); grid.setAttribute('y', py);
  grid.setAttribute('width', w - px * 2); grid.setAttribute('height', h - py * 2);

  // Linea e area
  document.getElementById('modal-line-path').setAttribute('points', pts);
  document.getElementById('modal-area').setAttribute('points', area);

  // Labels assi
  document.getElementById('modal-label-start').textContent = labels[0];
  document.getElementById('modal-label-start').setAttribute('x', px);
  document.getElementById('modal-label-start').setAttribute('y', py - 8);

  document.getElementById('modal-label-end').textContent = labels[n-1];
  document.getElementById('modal-label-end').setAttribute('x', w - px - 40);
  document.getElementById('modal-label-end').setAttribute('y', py - 8);

  const firstY = h - py - ((prices[0] - mn) / r) * (h - py * 2);
  const lastY = ys[n-1];
  const lastX = xs[n-1];

  document.getElementById('modal-val-start').textContent = prices[0].toLocaleString('it-IT', {maximumFractionDigits:2});
  document.getElementById('modal-val-start').setAttribute('x', px - 8);
  document.getElementById('modal-val-start').setAttribute('y', firstY + 4);

  document.getElementById('modal-val-end').textContent = prices[n-1].toLocaleString('it-IT', {maximumFractionDigits:2});
  document.getElementById('modal-val-end').setAttribute('x', lastX + 10);
  document.getElementById('modal-val-end').setAttribute('y', lastY + 4);

  // Hit area
  const hit = document.getElementById('modal-hit');
  hit.setAttribute('x', px); hit.setAttribute('y', py);
  hit.setAttribute('width', w - px * 2); hit.setAttribute('height', h - py * 2);

  // Eventi interattivi
  hit.onmousemove = e => handleModalHover(e, xs, ys, labels, prices, px, w, n);
  hit.onmouseleave = () => hideModalTooltip();

  // Nascondi guida inizialmente
  document.getElementById('modal-guide').style.opacity = 0;
  document.getElementById('modal-point').style.opacity = 0;
}

function handleModalHover(e, xs, ys, labels, prices, px, w, n) {
  const rect = e.target.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const plotW = w - px * 2;
  const relX = mouseX - px;
  let idx = Math.round((relX / plotW) * (n - 1));
  idx = Math.max(0, Math.min(n - 1, idx));

  const x = xs[idx], y = ys[idx];
  const guide = document.getElementById('modal-guide');
  const point = document.getElementById('modal-point');

  guide.setAttribute('x1', x); guide.setAttribute('x2', x);
  guide.setAttribute('y1', 40); guide.setAttribute('y2', 380);
  guide.style.opacity = 1;

  point.setAttribute('cx', x); point.setAttribute('cy', y);
  point.style.opacity = 1;

  // Tooltip
  const tt = document.getElementById('modal-tooltip');
  const wrap = document.getElementById('modal-chart-wrap');
  const wrapRect = wrap.getBoundingClientRect();

  document.getElementById('tt-date').textContent = labels[idx];
  document.getElementById('tt-val').textContent = prices[idx].toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});

  // Posiziona tooltip in percentuale rispetto al container
  const xPct = (x / 900) * 100;
  const yPct = (y / 420) * 100;
  tt.style.left = xPct + '%';
  tt.style.top = yPct + '%';
  tt.style.transform = 'translate(-50%, -130%)';
  tt.style.opacity = 1;
}

function hideModalTooltip() {
  document.getElementById('modal-guide').style.opacity = 0;
  document.getElementById('modal-point').style.opacity = 0;
  document.getElementById('modal-tooltip').style.opacity = 0;
}

function renderModalTable() {
  const { labels, prices } = currentModalData;
  const tbody = document.getElementById('modal-tbody');
  let html = '';
  prices.forEach((p, i) => {
    const prev = i > 0 ? prices[i-1] : p;
    const diff = p - prev;
    const pct = i > 0 ? ((diff / prev) * 100).toFixed(2) : '0.00';
    const col = diff >= 0 ? 'var(--up)' : 'var(--dn)';
    const sg = diff >= 0 ? '+' : '';
    html += `<tr>
      <td>${labels[i]}</td>
      <td>${p.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
      <td class="dt-var" style="color:${col}">${i===0?'—':sg+diff.toFixed(2)}</td>
      <td class="dt-var" style="color:${col}">${i===0?'—':sg+pct+'%'}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
}
</script>
