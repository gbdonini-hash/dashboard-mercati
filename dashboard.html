<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Market Overview | Dashboard Istituzionale</title>
<style>
/* PALETTE ISTITUZIONALE - SOBRIA ED ELEGANTE */
:root{
  --bg:#f4f7f9; --card:#ffffff; --text:#1e293b; --t2:#64748b; --t3:#94a3b8;
  --b:#e2e8f0; --up:#059669; --dn:#dc2626; --ac:#1e3a8a; /* Blu Notte Istituzionale */
  --sh:rgba(15,23,42,.05); --al:#d97706;
}
[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --t2:#94a3b8; --t3:#64748b;
  --b:#334155; --up:#10b981; --dn:#ef4444; --ac:#3b82f6; --sh:rgba(0,0,0,.4); --al:#f59e0b;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--t2:#94a3b8;--t3:#64748b;--b:#334155;--up:#10b981;--dn:#ef4444;--ac:#3b82f6;--sh:rgba(0,0,0,.4);--al:#f59e0b}}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);padding:24px 32px;transition:background .3s,color .3s;
}

/* HEADER */
.tb{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--b);padding-bottom:16px}
.tb h1{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--ac)}
.tb p{font-size:13px;color:var(--t2);margin-top:4px;font-weight:500}
.tr{display:flex;align-items:center;gap:16px}
.ut{font-size:12px;color:var(--t2);font-weight:500;background:var(--card);padding:6px 12px;border-radius:6px;border:1px solid var(--b)}
.tt{background:var(--card);border:1px solid var(--b);color:var(--t2);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.tt:hover{border-color:var(--ac);color:var(--ac)}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t2);background:transparent;border:1px solid transparent;transition:all .2s}
.tab:hover{color:var(--ac);background:var(--card)}
.tab.a{background:var(--ac);color:#fff;border-color:var(--ac)}
.sec{display:none}
.sec.a{display:block}

/* GRID E CARDS */
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.c{background:var(--card);border-radius:8px;padding:20px;border:1px solid var(--b);transition:box-shadow .2s,border-color .2s;position:relative;animation:fiu .4s ease both}
.c:hover{box-shadow:0 4px 12px var(--sh);border-color:var(--t3)}
@keyframes fiu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.n{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.p{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text)}
.r{display:flex;align-items:baseline;gap:12px;margin-top:8px}
.ch{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}

/* SPARKLINE PROFESSIONALE (Lineare) */
.cw{width:100%;height:40px;margin-top:16px;position:relative}
.cw svg{width:100%;height:100%;display:block;overflow:visible}
.bm{display:inline-block;font-size:10px;background:var(--t3);color:#fff;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px}

/* SEZIONE STORICI */
.h2{font-size:18px;font-weight:700;margin:40px 0 20px;color:var(--ac);letter-spacing:-.3px}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px}
.lc-card{background:var(--card);border-radius:8px;padding:20px;border:1px solid var(--b);cursor:pointer;transition:all .2s}
.lc-card:hover{border-color:var(--ac);box-shadow:0 4px 12px var(--sh)}
.lc-card h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.lc-card .open-hint{font-size:11px;color:var(--ac);font-weight:600;opacity:0;transition:opacity .2s}
.lc-card:hover .open-hint{opacity:1}
.lc-card svg{width:100%;height:180px;display:block}
.lc-card .info{display:flex;gap:20px;margin-top:12px;font-size:12px;color:var(--t2);font-weight:500}
.lc-card .info span{color:var(--text);font-weight:700}

/* MODAL */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:24px}
.modal.active{display:flex}
.modal-content{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:32px;width:100%;max-width:1100px;max-height:90vh;overflow:auto;position:relative;box-shadow:0 24px 48px rgba(0,0,0,.2);animation:fiu .3s ease both}
.modal-close{position:absolute;top:20px;right:24px;font-size:28px;cursor:pointer;color:var(--t2);line-height:1;transition:color .2s}
.modal-close:hover{color:var(--dn)}
.modal h2{font-size:22px;font-weight:700;margin-bottom:4px;color:var(--ac)}
.modal-sub{font-size:14px;color:var(--t2);margin-bottom:24px}
.modal-chart-wrap{position:relative;width:100%;height:400px;margin-bottom:24px}
.modal-chart-wrap svg{width:100%;height:100%;display:block}
.modal-tooltip{position:absolute;background:var(--text);color:var(--bg);border-radius:6px;padding:10px 14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:10;white-space:nowrap}
.modal-tooltip .tt-date{opacity:.8;font-size:11px;margin-bottom:4px}
.modal-tooltip .tt-val{font-weight:700;font-size:15px}
.modal-line{stroke:var(--t3);stroke-width:1;stroke-dasharray:4 4;opacity:0;pointer-events:none}
.modal-dot{fill:var(--ac);stroke:var(--card);stroke-width:3;opacity:0;pointer-events:none}
.modal-overlay{fill:transparent;cursor:crosshair}

/* TABELLA DATI */
.data-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
.data-table th,.data-table td{padding:12px;text-align:left;border-bottom:1px solid var(--b)}
.data-table th{color:var(--t2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg)}
.data-table td{font-variant-numeric:tabular-nums;font-weight:500}
.data-table tr:hover td{background:var(--bg)}
.data-table .dt-var{font-weight:700}
.ft{margin-top:40px;font-size:11px;color:var(--t3);text-align:center;border-top:1px solid var(--b);padding-top:20px}
</style>
</head>
<body>
<div class="tb">
  <div>
    <h1>Market Overview</h1>
    <p>Monitoraggio Asset Class · Contesto Macro · Visione Strategica</p>
  </div>
  <div class="tr">
    <span class="ut" id="ut">Caricamento dati...</span>
    <button class="tt" onclick="tog()">🌓 Tema</button>
  </div>
</div>

<div class="tabs">
  <button class="tab a" onclick="sw('fx', event)">Valute</button>
  <button class="tab" onclick="sw('ix', event)">Azionario Globale</button>
  <button class="tab" onclick="sw('sc', event)">Settori</button>
  <button class="tab" onclick="sw('mc', event)">Macro & Tassi</button>
</div>

<div id="s-fx" class="sec a"><div class="g" id="g-fx"></div></div>
<div id="s-ix" class="sec"><div class="g" id="g-ix"></div></div>
<div id="s-sc" class="sec"><div class="g" id="g-sc"></div></div>
<div id="s-mc" class="sec"><div class="g" id="g-mc"></div></div>

<h2 class="h2">Andamenti Storici (12 Mesi)</h2>
<div class="lc-grid" id="lc"></div>

<!-- Modal -->
<div id="modal" class="modal" onclick="closeModalOutside(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-close" onclick="closeModal()">&times;</div>
    <h2 id="modal-title"></h2>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-chart-wrap" id="modal-chart-wrap">
      <svg id="modal-svg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="modalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--ac)" stop-opacity=".15"/>
            <stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect id="modal-grid" fill="none" stroke="var(--b)" stroke-width="1"/>
        <polyline id="modal-line-path" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon id="modal-area" fill="url(#modalGrad)"/>
        <line id="modal-guide" class="modal-line" x1="0" y1="0" x2="0" y2="420"/>
        <circle id="modal-point" class="modal-dot" r="5"/>
        <text id="modal-label-start" font-size="12" font-weight="600" fill="var(--t2)"></text>
        <text id="modal-label-end" font-size="12" font-weight="600" fill="var(--t2)"></text>
        <text id="modal-val-start" font-size="12" font-weight="600" fill="var(--t2)" text-anchor="end"></text>
        <text id="modal-val-end" font-size="14" fill="var(--ac)" font-weight="700"></text>
        <rect id="modal-hit" class="modal-overlay" width="900" height="420"/>
      </svg>
      <div id="modal-tooltip" class="modal-tooltip">
        <div class="tt-date" id="tt-date"></div>
        <div class="tt-val" id="tt-val"></div>
      </div>
    </div>
    <table class="data-table" id="modal-table">
      <thead><tr><th>Periodo</th><th>Valore</th><th>Variazione Assoluta</th><th>Variazione %</th></tr></thead>
      <tbody id="modal-tbody"></tbody>
    </table>
  </div>
</div>

<div class="ft">Dati elaborati da Yahoo Finance · Aggiornamento automatico ogni 30 minuti · Dashboard per uso professionale</div>

<script>
let D = {};
let L = {};

// Genera una sparkline lineare professionale (invece delle candele)
function sparkline(cd, mn, mx) {
  const w = 240, h = 40, px = 2, n = cd.length;
  const r = mx - mn || 1;
  let pts = "";
  
  cd.forEach((c, i) => {
    // Usa il prezzo di chiusura (c[3])
    const x = px + (i / (n - 1)) * (w - px * 2);
    const y = h - ((c[3] - mn) / r) * (h - 4) - 2;
    pts += (i ? "L" : "M") + x + "," + y;
  });

  const firstY = h - ((cd[0][3] - mn) / r) * (h - 4) - 2;
  const lastY = h - ((cd[n-1][3] - mn) / r) * (h - 4) - 2;
  const color = cd[n-1][3] >= cd[0][3] ? "var(--up)" : "var(--dn)";

  return `<div class="cw"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${w-px}" cy="${lastY}" r="3" fill="${color}"/>
  </svg></div>`;
}

function rd(k, gid) {
  const g = document.getElementById(gid);
  if (!D[k]) { g.innerHTML = "<p style='color:var(--t2);font-size:13px;padding:20px'>Dati non disponibili al momento.</p>"; return; }
  
  g.innerHTML = D[k].map((it, idx) => {
    const n = it[0], pr = it[1], ch = it[2], cp = it[3], cd = it[4], mn = it[5], mx = it[6];
    const ip = cp >= 0, sg = ip ? "+" : "", cl = ip ? "up" : "dn";
    const fr = pr < 100 && !n.includes("VIX") && !n.includes("Treasury") && !n.includes("Spread") ? 4 : 2;
    
    // Tag "Manuale" per BTP/FTSE se necessario
    const mb = (n.includes("FTSE") || n.includes("Spread")) ? '<span class="bm">MANUALE</span>' : "";
    
    return `
    <div class="c" style="animation-delay:${idx * 0.03}s">
      <div class="n">${n} ${mb}</div>
      <div class="p">${pr.toLocaleString("it-IT", {minimumFractionDigits: fr, maximumFractionDigits: fr})}</div>
      <div class="r">
        <span class="ch ${cl}">${ip ? "▲" : "▼"} ${sg}${cp}%</span>
        <span class="ch ${cl}" style="opacity:.7;font-size:12px">${sg}${ch.toLocaleString("it-IT", {minimumFractionDigits: fr, maximumFractionDigits: fr})}</span>
      </div>
      ${sparkline(cd, mn, mx)}
    </div>`;
  }).join("");
}

function sw(t, e) {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("a"));
  document.querySelectorAll(".sec").forEach(x => x.classList.remove("a"));
  e.target.classList.add("a");
  document.getElementById("s-" + t).classList.add("a");
}

function tog() {
  const h = document.documentElement, c = h.getAttribute("data-theme");
  if (c === "dark") h.setAttribute("data-theme", "light");
  else if (c === "light") h.removeAttribute("data-theme");
  else h.setAttribute("data-theme", "dark");
}

// GRAFICI STORICI (Mini e Modal)
function buildMini(name, d, idx) {
  const labels = d[0], prices = d[1], mn = d[2], mx = d[3], w = 700, h = 180, px = 40, py = 20, r = mx - mn || 1, n = prices.length;
  let pts = "", area = "";
  prices.forEach((p, i) => {
    const x = px + (i / (n - 1)) * (w - px * 2), y = h - py - ((p - mn) / r) * (h - py * 2);
    pts += (i ? "L" : "M") + x + "," + y;
    area += x + "," + y + " ";
  });
  area += (w - px) + "," + h + " " + px + "," + h;
  const lastX = px + ((n - 1) / (n - 1)) * (w - px * 2), lastY = h - py - ((prices[n - 1] - mn) / r) * (h - py * 2);
  const firstY = h - py - ((prices[0] - mn) / r) * (h - py * 2);
  const varTot = ((prices[prices.length - 1] - prices[0]) / prices[0] * 100).toFixed(2);
  const gradId = "g" + name.replace(/[^a-z]/gi, "") + idx;
  
  return `
  <div class="lc-card" onclick="openModal('${name.replace(/'/g, "\\'")}')">
    <h3>${name} <span class="open-hint">Analisi dettagliata →</span></h3>
    <svg viewBox="0 0 ${w} ${h}">
      <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--ac)" stop-opacity=".15"/><stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
      <rect x="${px}" y="${py}" width="${w - px * 2}" height="${h - py * 2}" fill="none" stroke="var(--b)" stroke-width="1"/>
      <polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="${area}" fill="url(#${gradId})"/>
      <circle cx="${lastX}" cy="${lastY}" r="4" fill="var(--ac)" stroke="var(--card)" stroke-width="2"/>
      <text x="${px}" y="${py - 6}" font-size="11" font-weight="600" fill="var(--t2)">${labels[0]}</text>
      <text x="${w - px - 40}" y="${py - 6}" font-size="11" font-weight="600" fill="var(--t2)">${labels[labels.length - 1]}</text>
      <text x="${px - 5}" y="${firstY + 4}" font-size="11" font-weight="600" fill="var(--t2)" text-anchor="end">${prices[0]}</text>
      <text x="${lastX + 8}" y="${lastY + 4}" font-size="12" font-weight="700" fill="var(--ac)">${prices[prices.length - 1]}</text>
    </svg>
    <div class="info"><span>Min: ${mn}</span><span>Max: ${mx}</span><span>Var: ${varTot}%</span></div>
  </div>`;
}

let currentModalData = null;
function openModal(name) {
  const data = L[name];
  if (!data) return;
  currentModalData = { name, labels: data[0], prices: data[1], mn: data[2], mx: data[3] };
  document.getElementById('modal-title').textContent = name;
  const varTot = ((data[1][data[1].length - 1] - data[1][0]) / data[1][0] * 100).toFixed(2);
  const segno = varTot >= 0 ? '+' : '';
  const col = varTot >= 0 ? 'var(--up)' : 'var(--dn)';
  document.getElementById('modal-sub').innerHTML = `Andamento a 12 mesi · <span style="color:${col};font-weight:700">${segno}${varTot}%</span> da inizio periodo`;
  renderModalChart();
  renderModalTable();
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
  currentModalData = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderModalChart() {
  const { labels, prices, mn, mx } = currentModalData;
  const w = 900, h = 420, px = 60, py = 40, n = prices.length;
  const r = mx - mn || 1;
  let pts = "", area = "";
  const xs = [], ys = [];
  prices.forEach((p, i) => {
    const x = px + (i / (n - 1)) * (w - px * 2);
    const y = h - py - ((p - mn) / r) * (h - py * 2);
    xs.push(x); ys.push(y);
    pts += (i ? "L" : "M") + x + "," + y;
    area += x + "," + y + " ";
  });
  area += (w - px) + "," + h + " " + px + "," + h;
  const grid = document.getElementById('modal-grid');
  grid.setAttribute('x', px); grid.setAttribute('y', py);
  grid.setAttribute('width', w - px * 2); grid.setAttribute('height', h - py * 2);
  document.getElementById('modal-line-path').setAttribute('points', pts);
  document.getElementById('modal-area').setAttribute('points', area);
  
  document.getElementById('modal-label-start').textContent = labels[0];
  document.getElementById('modal-label-start').setAttribute('x', px);
  document.getElementById('modal-label-start').setAttribute('y', py - 10);
  
  document.getElementById('modal-label-end').textContent = labels[n - 1];
  document.getElementById('modal-label-end').setAttribute('x', w - px - 40);
  document.getElementById('modal-label-end').setAttribute('y', py - 10);
  
  const firstY = h - py - ((prices[0] - mn) / r) * (h - py * 2);
  const lastY = ys[n - 1], lastX = xs[n - 1];
  
  document.getElementById('modal-val-start').textContent = prices[0].toLocaleString('it-IT', {maximumFractionDigits: 2});
  document.getElementById('modal-val-start').setAttribute('x', px - 10);
  document.getElementById('modal-val-start').setAttribute('y', firstY + 4);
  
  document.getElementById('modal-val-end').textContent = prices[n - 1].toLocaleString('it-IT', {maximumFractionDigits: 2});
  document.getElementById('modal-val-end').setAttribute('x', lastX + 10);
  document.getElementById('modal-val-end').setAttribute('y', lastY + 4);
  
  const hit = document.getElementById('modal-hit');
  hit.setAttribute('x', px); hit.setAttribute('y', py);
  hit.setAttribute('width', w - px * 2); hit.setAttribute('height', h - py * 2);
  hit.onmousemove = e => handleModalHover(e, xs, ys, labels, prices, px, w, n);
  hit.onmouseleave = () => hideModalTooltip();
  
  document.getElementById('modal-guide').style.opacity = 0;
  document.getElementById('modal-point').style.opacity = 0;
}

function handleModalHover(e, xs, ys, labels, prices, px, w, n) {
  const rect = e.target.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const plotW = w - px * 2;
  const relX = mouseX - px;
  let idx = Math.round((relX / plotW) * (n - 1));
  idx = Math.max(0, Math.min(n - 1, idx));
  
  const x = xs[idx], y = ys[idx];
  const guide = document.getElementById('modal-guide');
  const point = document.getElementById('modal-point');
  
  guide.setAttribute('x1', x); guide.setAttribute('x2', x);
  guide.setAttribute('y1', 40); guide.setAttribute('y2', 380);
  guide.style.opacity = 1;
  
  point.setAttribute('cx', x); point.setAttribute('cy', y);
  point.style.opacity = 1;
  
  const tt = document.getElementById('modal-tooltip');
  document.getElementById('tt-date').textContent = labels[idx];
  document.getElementById('tt-val').textContent = prices[idx].toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  
  const xPct = (x / 900) * 100;
  const yPct = (y / 420) * 100;
  tt.style.left = xPct + '%';
  tt.style.top = yPct + '%';
  tt.style.transform = 'translate(-50%, -130%)';
  tt.style.opacity = 1;
}

function hideModalTooltip() {
  document.getElementById('modal-guide').style.opacity = 0;
  document.getElementById('modal-point').style.opacity = 0;
  document.getElementById('modal-tooltip').style.opacity = 0;
}

function renderModalTable() {
  const { labels, prices } = currentModalData;
  const tbody = document.getElementById('modal-tbody');
  let html = '';
  prices.forEach((p, i) => {
    const prev = i > 0 ? prices[i - 1] : p;
    const diff = p - prev;
    const pct = i > 0 ? ((diff / prev) * 100).toFixed(2) : '0.00';
    const col = diff >= 0 ? 'var(--up)' : 'var(--dn)';
    const sg = diff >= 0 ? '+' : '';
    html += `<tr>
      <td style="font-weight:600">${labels[i]}</td>
      <td>${p.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      <td class="dt-var" style="color:${col}">${i === 0 ? '—' : sg + diff.toFixed(2)}</td>
      <td class="dt-var" style="color:${col}">${i === 0 ? '—' : sg + pct + '%'}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

async function caricaDati() {
  try {
    const response = await fetch('dati.json');
    if (!response.ok) throw new Error("Errore di rete");
    const data = await response.json();
    
    if (data.timestamp) {
      document.getElementById("ut").textContent = "Ultimo aggiornamento: " + data.timestamp;
    }
    
    D = data.D || {};
    L = data.L || {};
    
    rd("forex", "g-fx");
    rd("indices", "g-ix");
    rd("sectors", "g-sc");
    rd("macro", "g-mc");
    
    const lc = document.getElementById("lc");
    lc.innerHTML = ""; 
    if (Object.keys(L).length > 0) {
      Object.entries(L).forEach(([name, d], idx) => {
        lc.innerHTML += buildMini(name, d, idx);
      });
    } else {
      lc.innerHTML = "<p style='color:var(--t2);font-size:14px'>Dati storici in fase di caricamento.</p>";
    }
  } catch (error) {
    console.error("Errore:", error);
    document.getElementById("ut").textContent = "Dati non disponibili";
  }
}

document.addEventListener("DOMContentLoaded", caricaDati);
</script>
</body>
</html>
